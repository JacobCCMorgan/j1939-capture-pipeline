name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: rebuild the reports from the published data
        run: |
          j1939cap summarize data/input/captures --out /tmp/reports
          j1939cap pair data/input/captures data/input/device_logs --out /tmp/reports
          j1939cap fleet data/input --out /tmp/reports
      - name: the committed reports match a fresh run
        run: diff -r reports /tmp/reports
